---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <time class="post-date">{{ page.date | date: "%Y-%m-%d" }}</time>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <a href="{{ '/' | relative_url }}" class="back-link">&larr; Back to posts</a>
</article>
